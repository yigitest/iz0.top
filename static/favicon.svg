<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>iz0.top isotope mark</title>
  <style>
    .orbit-cyan { stroke: #0891b2; }
    .orbit-amber { stroke: #d97706; }
    .orbit-rose { stroke: #e11d48; }
    .electron-cyan { fill: #0891b2; }
    .electron-amber { fill: #d97706; }
    .nucleus { stroke: #111827; }

    @media (prefers-color-scheme: dark) {
      .orbit-cyan { stroke: #67e8f9; }
      .orbit-amber { stroke: #fbbf24; }
      .orbit-rose { stroke: #fb7185; }
      .electron-cyan { fill: #67e8f9; }
      .electron-amber { fill: #fbbf24; }
      .nucleus { stroke: #f8fafc; }
    }
  </style>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="22" ry="10" class="orbit-cyan" stroke="#0891b2" stroke-width="3" transform="rotate(-32 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="10" class="orbit-amber" stroke="#d97706" stroke-width="3" transform="rotate(32 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="10" class="orbit-rose" stroke="#e11d48" stroke-width="3"/>
  </g>
  <circle cx="32" cy="32" r="6" class="nucleus" fill="none" stroke="#111827" stroke-width="4"/>
  <circle cx="51" cy="21" r="3.5" class="electron-cyan" fill="#0891b2"/>
  <circle cx="16" cy="23" r="3.5" class="electron-amber" fill="#d97706"/>
</svg>